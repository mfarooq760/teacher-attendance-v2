name: Build Teacher Attendance V2 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Clean and Generate Pristine Android Project
        run: |
          rm -rf app build.gradle* settings.gradle* local.properties

          mkdir -p app/src/main/java/com/school/teacherrecords
          mkdir -p app/src/main/res/xml

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TeacherRecords"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.school.teacherrecords'
              compileSdk 34

              defaultConfig {
                  applicationId "com.school.teacherrecords"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.foundation:foundation'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-core'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Teacher Attendance"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.school.teacherrecords.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 6. file_paths.xml
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          EOF

          # 7. DatabaseHelper.kt
          cat << 'EOF' > app/src/main/java/com/school/teacherrecords/DatabaseHelper.kt
          package com.school.teacherrecords

          import android.content.ContentValues
          import android.content.Context
          import android.database.DatabaseUtils
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          data class Teacher(
              val recordId: Long,
              val name: String,
              val fatherName: String,
              val appointmentSession: String
          )

          data class EnrolledTeacher(
              val enrollmentId: Long,
              val recordId: Long,
              val name: String,
              val fatherName: String
          )

          data class ReportRow(
              val name: String,
              val fatherName: String,
              val absent: Int,
              val late: Int,
              val halfDay: Int,
              val leave: Int
          )

          data class PrintRow(
              val date: String,
              val name: String,
              val fatherName: String,
              val status: String
          )

          data class TeacherRow(val recordId: Long, val name: String, val fatherName: String, val appointmentSession: String)
          data class EnrollmentRow(val enrollmentId: Long, val teacherId: Long, val session: String, val month: Int)
          data class AttendanceRow(val attendanceId: Long, val teacherId: Long, val enrollmentId: Long, val date: String, val status: String)
          data class BackupData(
              val version: Int,
              val teachers: List<TeacherRow>?,
              val enrollments: List<EnrollmentRow>?,
              val attendance: List<AttendanceRow>?
          )

          class DatabaseHelper(context: Context) : SQLiteOpenHelper(context, "TeacherRecords.db", null, 2) {

              override fun onConfigure(db: SQLiteDatabase) {
                  super.onConfigure(db)
                  db.setForeignKeyConstraintsEnabled(true)
              }

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("""
                      CREATE TABLE tblTeachers (
                          RecordID INTEGER PRIMARY KEY AUTOINCREMENT,
                          TeacherName TEXT NOT NULL,
                          FatherHusbandName TEXT NOT NULL,
                          AppointmentSession TEXT NOT NULL
                      )
                  """.trimIndent())

                  db.execSQL("""
                      CREATE TABLE tblAttendanceEnrollment (
                          EnrollmentID INTEGER PRIMARY KEY AUTOINCREMENT,
                          EnrollmentRecordIDFK INTEGER NOT NULL REFERENCES tblTeachers(RecordID) ON DELETE CASCADE,
                          AttendanceEnrollmentSession TEXT NOT NULL,
                          AttendanceEnrollmentMonth INTEGER NOT NULL,
                          UNIQUE (EnrollmentRecordIDFK, AttendanceEnrollmentSession, AttendanceEnrollmentMonth)
                      )
                  """.trimIndent())

                  createRecordsTable(db)
              }

              private fun createRecordsTable(db: SQLiteDatabase) {
                  db.execSQL("""
                      CREATE TABLE tblAttendanceRecords (
                          AttendanceID INTEGER PRIMARY KEY AUTOINCREMENT,
                          AttendanceRecordIDFK INTEGER NOT NULL REFERENCES tblTeachers(RecordID) ON DELETE CASCADE,
                          AttendanceEnrollmentIDFK INTEGER NOT NULL REFERENCES tblAttendanceEnrollment(EnrollmentID) ON DELETE CASCADE,
                          AttendanceDate TEXT NOT NULL,
                          AttendanceStatus TEXT NOT NULL,
                          UNIQUE (AttendanceRecordIDFK, AttendanceDate, AttendanceStatus)
                      )
                  """.trimIndent())
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  if (oldVersion < 2) {
                      db.execSQL("DROP TABLE IF EXISTS tblAttendanceRecords")
                      createRecordsTable(db)
                  }
              }

              fun getCounts(): Triple<Int, Int, Int> {
                  val db = readableDatabase
                  return Triple(
                      DatabaseUtils.queryNumEntries(db, "tblTeachers").toInt(),
                      DatabaseUtils.queryNumEntries(db, "tblAttendanceEnrollment").toInt(),
                      DatabaseUtils.queryNumEntries(db, "tblAttendanceRecords").toInt()
                  )
              }

              fun getTeachers(sessionPrefix: String): List<Teacher> {
                  val list = mutableListOf<Teacher>()
                  val sql = "SELECT RecordID, TeacherName, FatherHusbandName, AppointmentSession FROM tblTeachers" +
                      (if (sessionPrefix.isBlank()) "" else " WHERE AppointmentSession LIKE ?") +
                      " ORDER BY TeacherName COLLATE NOCASE"
                  val args = if (sessionPrefix.isBlank()) null else arrayOf("$sessionPrefix%")
                  readableDatabase.rawQuery(sql, args).use { c ->
                      while (c.moveToNext()) {
                          list.add(Teacher(c.getLong(0), c.getString(1), c.getString(2), c.getString(3)))
                      }
                  }
                  return list
              }

              fun getEligibleTeachers(session: String): List<Teacher> {
                  val list = mutableListOf<Teacher>()
                  val sql = "SELECT RecordID, TeacherName, FatherHusbandName, AppointmentSession FROM tblTeachers " +
                      "WHERE AppointmentSession <= ? ORDER BY TeacherName COLLATE NOCASE"
                  readableDatabase.rawQuery(sql, arrayOf(session)).use { c ->
                      while (c.moveToNext()) {
                          list.add(Teacher(c.getLong(0), c.getString(1), c.getString(2), c.getString(3)))
                      }
                  }
                  return list
              }

              fun insertTeacher(name: String, fatherName: String, session: String): Long {
                  val v = ContentValues().apply {
                      put("TeacherName", name)
                      put("FatherHusbandName", fatherName)
                      put("AppointmentSession", session)
                  }
                  return writableDatabase.insert("tblTeachers", null, v)
              }

              fun updateTeacher(recordId: Long, name: String, fatherName: String, session: String) {
                  val v = ContentValues().apply {
                      put("TeacherName", name)
                      put("FatherHusbandName", fatherName)
                      put("AppointmentSession", session)
                  }
                  writableDatabase.update("tblTeachers", v, "RecordID = ?", arrayOf(recordId.toString()))
              }

              fun deleteTeacher(recordId: Long) {
                  val db = writableDatabase
                  val id = arrayOf(recordId.toString())
                  db.beginTransaction()
                  try {
                      db.delete("tblAttendanceRecords", "AttendanceRecordIDFK = ?", id)
                      db.delete("tblAttendanceEnrollment", "EnrollmentRecordIDFK = ?", id)
                      db.delete("tblTeachers", "RecordID = ?", id)
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
              }

              fun enrol(recordIds: List<Long>, session: String, months: List<Int>): Int {
                  var added = 0
                  val db = writableDatabase
                  db.beginTransaction()
                  try {
                      for (id in recordIds) {
                          for (m in months) {
                              val v = ContentValues().apply {
                                  put("EnrollmentRecordIDFK", id)
                                  put("AttendanceEnrollmentSession", session)
                                  put("AttendanceEnrollmentMonth", m)
                              }
                              val rowId = db.insertWithOnConflict(
                                  "tblAttendanceEnrollment", null, v, SQLiteDatabase.CONFLICT_IGNORE
                              )
                              if (rowId != -1L) added++
                          }
                      }
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
                  return added
              }

              fun getEnrolledIds(session: String, month: Int): Set<Long> {
                  val set = mutableSetOf<Long>()
                  val sql = "SELECT EnrollmentRecordIDFK FROM tblAttendanceEnrollment " +
                      "WHERE AttendanceEnrollmentSession = ? AND AttendanceEnrollmentMonth = ?"
                  readableDatabase.rawQuery(sql, arrayOf(session, month.toString())).use { c ->
                      while (c.moveToNext()) set.add(c.getLong(0))
                  }
                  return set
              }

              fun getEnrolledTeachers(session: String, month: Int): List<EnrolledTeacher> {
                  val list = mutableListOf<EnrolledTeacher>()
                  val sql = "SELECT e.EnrollmentID, t.RecordID, t.TeacherName, t.FatherHusbandName " +
                      "FROM tblAttendanceEnrollment e JOIN tblTeachers t ON t.RecordID = e.EnrollmentRecordIDFK " +
                      "WHERE e.AttendanceEnrollmentSession = ? AND e.AttendanceEnrollmentMonth = ? " +
                      "ORDER BY t.TeacherName COLLATE NOCASE"
                  readableDatabase.rawQuery(sql, arrayOf(session, month.toString())).use { c ->
                      while (c.moveToNext()) {
                          list.add(EnrolledTeacher(c.getLong(0), c.getLong(1), c.getString(2), c.getString(3)))
                      }
                  }
                  return list
              }

              fun getTeachersEnrolledInSession(session: String): List<Teacher> {
                  val list = mutableListOf<Teacher>()
                  val sql = "SELECT DISTINCT t.RecordID, t.TeacherName, t.FatherHusbandName, t.AppointmentSession " +
                      "FROM tblAttendanceEnrollment e JOIN tblTeachers t ON t.RecordID = e.EnrollmentRecordIDFK " +
                      "WHERE e.AttendanceEnrollmentSession = ? ORDER BY t.TeacherName COLLATE NOCASE"
                  readableDatabase.rawQuery(sql, arrayOf(session)).use { c ->
                      while (c.moveToNext()) {
                          list.add(Teacher(c.getLong(0), c.getString(1), c.getString(2), c.getString(3)))
                      }
                  }
                  return list
              }

              fun getAttendanceForDate(session: String, month: Int, date: String): Map<Long, String> {
                  val map = mutableMapOf<Long, String>()
                  val sql = "SELECT r.AttendanceEnrollmentIDFK, r.AttendanceStatus " +
                      "FROM tblAttendanceRecords r JOIN tblAttendanceEnrollment e ON e.EnrollmentID = r.AttendanceEnrollmentIDFK " +
                      "WHERE e.AttendanceEnrollmentSession = ? AND e.AttendanceEnrollmentMonth = ? AND r.AttendanceDate = ?"
                  readableDatabase.rawQuery(sql, arrayOf(session, month.toString(), date)).use { c ->
                      while (c.moveToNext()) map[c.getLong(0)] = c.getString(1)
                  }
                  return map
              }

              fun saveAttendanceDay(date: String, enrolled: List<EnrolledTeacher>, statuses: Map<Long, String>) {
                  val db = writableDatabase
                  db.beginTransaction()
                  try {
                      for (t in enrolled) {
                          val st = statuses[t.enrollmentId] ?: ST_PRESENT
                          db.delete(
                              "tblAttendanceRecords",
                              "AttendanceEnrollmentIDFK = ? AND AttendanceDate = ?",
                              arrayOf(t.enrollmentId.toString(), date)
                          )
                          if (st != ST_PRESENT) {
                              val v = ContentValues().apply {
                                  put("AttendanceRecordIDFK", t.recordId)
                                  put("AttendanceEnrollmentIDFK", t.enrollmentId)
                                  put("AttendanceDate", date)
                                  put("AttendanceStatus", st)
                              }
                              db.insertWithOnConflict("tblAttendanceRecords", null, v, SQLiteDatabase.CONFLICT_REPLACE)
                          }
                      }
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
              }

              fun deleteAttendanceRecords(recordId: Long, session: String, month: Int?): Int {
                  val sub = "SELECT EnrollmentID FROM tblAttendanceEnrollment WHERE AttendanceEnrollmentSession = ?" +
                      (if (month != null) " AND AttendanceEnrollmentMonth = ?" else "")
                  val args = mutableListOf(recordId.toString(), session)
                  if (month != null) args.add(month.toString())
                  return writableDatabase.delete(
                      "tblAttendanceRecords",
                      "AttendanceRecordIDFK = ? AND AttendanceEnrollmentIDFK IN ($sub)",
                      args.toTypedArray()
                  )
              }

              fun getAttendanceBetween(session: String, fromDate: String, toDate: String): List<PrintRow> {
                  val list = mutableListOf<PrintRow>()
                  val sql = "SELECT r.AttendanceDate, t.TeacherName, t.FatherHusbandName, r.AttendanceStatus " +
                      "FROM tblAttendanceRecords r " +
                      "JOIN tblAttendanceEnrollment e ON e.EnrollmentID = r.AttendanceEnrollmentIDFK " +
                      "JOIN tblTeachers t ON t.RecordID = r.AttendanceRecordIDFK " +
                      "WHERE e.AttendanceEnrollmentSession = ? AND r.AttendanceDate BETWEEN ? AND ? " +
                      "ORDER BY r.AttendanceDate, t.TeacherName COLLATE NOCASE"
                  readableDatabase.rawQuery(sql, arrayOf(session, fromDate, toDate)).use { c ->
                      while (c.moveToNext()) {
                          list.add(PrintRow(c.getString(0), c.getString(1), c.getString(2), c.getString(3)))
                      }
                  }
                  return list
              }

              fun getMonthlyReport(session: String, month: Int): List<ReportRow> {
                  val list = mutableListOf<ReportRow>()
                  val sql = "SELECT t.TeacherName, t.FatherHusbandName, " +
                      "SUM(CASE WHEN r.AttendanceStatus = 'ABSENT' THEN 1 ELSE 0 END), " +
                      "SUM(CASE WHEN r.AttendanceStatus = 'LATE' THEN 1 ELSE 0 END), " +
                      "SUM(CASE WHEN r.AttendanceStatus = 'HALF_DAY' THEN 1 ELSE 0 END), " +
                      "SUM(CASE WHEN r.AttendanceStatus = 'LEAVE' THEN 1 ELSE 0 END) " +
                      "FROM tblAttendanceEnrollment e " +
                      "JOIN tblTeachers t ON t.RecordID = e.EnrollmentRecordIDFK " +
                      "LEFT JOIN tblAttendanceRecords r ON r.AttendanceEnrollmentIDFK = e.EnrollmentID " +
                      "WHERE e.AttendanceEnrollmentSession = ? AND e.AttendanceEnrollmentMonth = ? " +
                      "GROUP BY e.EnrollmentID ORDER BY t.TeacherName COLLATE NOCASE"
                  readableDatabase.rawQuery(sql, arrayOf(session, month.toString())).use { c ->
                      while (c.moveToNext()) {
                          list.add(ReportRow(c.getString(0), c.getString(1), c.getInt(2), c.getInt(3), c.getInt(4), c.getInt(5)))
                      }
                  }
                  return list
              }

              fun getBackup(): BackupData {
                  val db = readableDatabase
                  val teachers = mutableListOf<TeacherRow>()
                  val enrollments = mutableListOf<EnrollmentRow>()
                  val attendance = mutableListOf<AttendanceRow>()
                  db.rawQuery("SELECT RecordID, TeacherName, FatherHusbandName, AppointmentSession FROM tblTeachers", null).use { c ->
                      while (c.moveToNext()) teachers.add(TeacherRow(c.getLong(0), c.getString(1), c.getString(2), c.getString(3)))
                  }
                  db.rawQuery(
                      "SELECT EnrollmentID, EnrollmentRecordIDFK, AttendanceEnrollmentSession, AttendanceEnrollmentMonth FROM tblAttendanceEnrollment",
                      null
                  ).use { c ->
                      while (c.moveToNext()) enrollments.add(EnrollmentRow(c.getLong(0), c.getLong(1), c.getString(2), c.getInt(3)))
                  }
                  db.rawQuery(
                      "SELECT AttendanceID, AttendanceRecordIDFK, AttendanceEnrollmentIDFK, AttendanceDate, AttendanceStatus FROM tblAttendanceRecords",
                      null
                  ).use { c ->
                      while (c.moveToNext()) attendance.add(AttendanceRow(c.getLong(0), c.getLong(1), c.getLong(2), c.getString(3), c.getString(4)))
                  }
                  return BackupData(3, teachers, enrollments, attendance)
              }

              fun restoreBackup(data: BackupData) {
                  val db = writableDatabase
                  db.beginTransaction()
                  try {
                      db.delete("tblAttendanceRecords", null, null)
                      db.delete("tblAttendanceEnrollment", null, null)
                      db.delete("tblTeachers", null, null)
                      for (t in data.teachers.orEmpty()) {
                          val v = ContentValues().apply {
                              put("RecordID", t.recordId)
                              put("TeacherName", t.name)
                              put("FatherHusbandName", t.fatherName)
                              put("AppointmentSession", t.appointmentSession)
                          }
                          db.insertOrThrow("tblTeachers", null, v)
                      }
                      for (e in data.enrollments.orEmpty()) {
                          val v = ContentValues().apply {
                              put("EnrollmentID", e.enrollmentId)
                              put("EnrollmentRecordIDFK", e.teacherId)
                              put("AttendanceEnrollmentSession", e.session)
                              put("AttendanceEnrollmentMonth", e.month)
                          }
                          db.insertOrThrow("tblAttendanceEnrollment", null, v)
                      }
                      for (a in data.attendance.orEmpty()) {
                          val v = ContentValues().apply {
                              put("AttendanceID", a.attendanceId)
                              put("AttendanceRecordIDFK", a.teacherId)
                              put("AttendanceEnrollmentIDFK", a.enrollmentId)
                              put("AttendanceDate", a.date)
                              put("AttendanceStatus", a.status)
                          }
                          db.insertOrThrow("tblAttendanceRecords", null, v)
                      }
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
              }
          }
          EOF

          # 8. Common.kt
          cat << 'EOF' > app/src/main/java/com/school/teacherrecords/Common.kt
          @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)

          package com.school.teacherrecords

          import android.app.DatePickerDialog
          import android.content.Context
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import java.util.Calendar
          import java.util.Locale

          val MONTHS = listOf(
              "January", "February", "March", "April", "May", "June",
              "July", "August", "September", "October", "November", "December"
          )

          const val ST_PRESENT = "P"
          const val ST_ABSENT = "ABSENT"
          const val ST_LATE = "LATE"
          const val ST_HALF = "HALF_DAY"
          const val ST_LEAVE = "LEAVE"

          fun statusLabel(code: String): String = when (code) {
              ST_ABSENT -> "Absent"
              ST_LATE -> "Late"
              ST_HALF -> "Half Day"
              ST_LEAVE -> "Leave"
              else -> code
          }

          fun isLeapYear(y: Int): Boolean = (y % 4 == 0 && y % 100 != 0) || y % 400 == 0

          fun daysInMonth(year: Int, month: Int): Int = when (month) {
              2 -> if (isLeapYear(year)) 29 else 28
              4, 6, 9, 11 -> 30
              else -> 31
          }

          fun toIso(y: Int, m: Int, d: Int): String = String.format(Locale.US, "%04d-%02d-%02d", y, m, d)

          fun isoToDisplay(iso: String): String =
              iso.substring(8, 10) + "-" + iso.substring(5, 7) + "-" + iso.substring(0, 4)

          fun todayIso(): String {
              val c = Calendar.getInstance()
              return toIso(c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, c.get(Calendar.DAY_OF_MONTH))
          }

          fun firstOfMonthIso(): String {
              val c = Calendar.getInstance()
              return toIso(c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, 1)
          }

          fun pickDate(context: Context, currentIso: String, onPicked: (String) -> Unit) {
              val y = currentIso.substring(0, 4).toInt()
              val m = currentIso.substring(5, 7).toInt() - 1
              val d = currentIso.substring(8, 10).toInt()
              DatePickerDialog(
                  context,
                  { _, yy, mm, dd -> onPicked(toIso(yy, mm + 1, dd)) },
                  y, m, d
              ).show()
          }

          fun formatSessionInput(raw: String): String {
              val d = raw.filter { it.isDigit() }.take(6)
              return if (d.length > 4) d.substring(0, 4) + "/" + d.substring(4) else d
          }

          fun isValidSession(s: String): Boolean {
              if (s.length != 7 || s[4] != '/') return false
              val a = s.substring(0, 4)
              val b = s.substring(5)
              if (!a.all { it.isDigit() } || !b.all { it.isDigit() }) return false
              return b.toInt() == (a.toInt() + 1) % 100
          }

          @Composable
          fun SessionField(
              value: String,
              onValueChange: (String) -> Unit,
              label: String = "Session (0000/00)",
              modifier: Modifier = Modifier.fillMaxWidth()
          ) {
              val bad = value.length == 7 && !isValidSession(value)
              OutlinedTextField(
                  value = value,
                  onValueChange = { onValueChange(formatSessionInput(it)) },
                  label = { Text(label) },
                  placeholder = { Text("0000/00") },
                  singleLine = true,
                  keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                  isError = bad,
                  supportingText = { if (bad) Text("Second part must be the next year, e.g. 2026/27") },
                  modifier = modifier
              )
          }

          @Composable
          fun DropdownField(
              label: String,
              options: List<String>,
              selectedIndex: Int,
              onSelect: (Int) -> Unit,
              modifier: Modifier = Modifier.fillMaxWidth()
          ) {
              var expanded by remember { mutableStateOf(false) }
              ExposedDropdownMenuBox(
                  expanded = expanded,
                  onExpandedChange = { expanded = !expanded },
                  modifier = modifier
              ) {
                  OutlinedTextField(
                      value = options.getOrElse(selectedIndex) { "" },
                      onValueChange = {},
                      readOnly = true,
                      label = { Text(label) },
                      trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded = expanded) },
