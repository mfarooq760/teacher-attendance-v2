name: Build Teacher Attendance V2 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Clean and Generate Pristine Android Project
        run: |
          # 0. Clean any conflicting files from previous runs
          rm -rf app build.gradle* settings.gradle*

          mkdir -p app/src/main/java/com/school/teacherrecords
          mkdir -p app/src/main/res/xml

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TeacherRecords"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          EOF

          # 2b. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.school.teacherrecords'
              compileSdk 34

              defaultConfig {
                  applicationId "com.school.teacherrecords"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }

              packaging {
                  resources {
                      excludes += ['/META-INF/versions/**', '/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
              implementation 'com.google.code.gson:gson:2.10.1'
              implementation 'org.postgresql:postgresql:42.7.3'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Teacher Attendance"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.school.teacherrecords.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 5. file_paths.xml
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          EOF

          # 6. DatabaseHelper.kt (PostgreSQL backend, three related tables)
          cat << 'EOF' > app/src/main/java/com/school/teacherrecords/DatabaseHelper.kt
          package com.school.teacherrecords

          import android.content.Context
          import java.sql.Connection
          import java.sql.DriverManager
          import java.sql.ResultSet
          import java.util.Properties

          // ---------- Row models ----------
          data class Teacher(
              val recordId: Long,
              val name: String,
              val fatherName: String,
              val appointmentSession: String
          )

          data class EnrolledTeacher(
              val enrollmentId: Long,
              val recordId: Long,
              val name: String,
              val fatherName: String
          )

          data class ReportRow(
              val name: String,
              val fatherName: String,
              val absent: Int,
              val late: Int,
              val halfDay: Int,
              val leave: Int
          )

          // ---------- Backup models ----------
          data class TeacherRow(val recordId: Long, val name: String, val fatherName: String, val appointmentSession: String)
          data class EnrollmentRow(val enrollmentId: Long, val teacherId: Long, val session: String, val month: Int)
          data class AttendanceRow(val attendanceId: Long, val teacherId: Long, val enrollmentId: Long, val date: String, val status: String)
          data class BackupData(
              val version: Int,
              val teachers: List<TeacherRow>?,
              val enrollments: List<EnrollmentRow>?,
              val attendance: List<AttendanceRow>?
          )

          // ---------- PostgreSQL connection settings (database, user and password come from BackendSpec) ----------
          object PgConfig {
              const val HOST = "127.0.0.1"
              const val PORT = 5432
              const val DATABASE = BackendSpec.DATABASE
              const val USER = BackendSpec.USER
              const val PASSWORD = BackendSpec.PASSWORD
          }

          class DatabaseHelper(context: Context) {

              private var connection: Connection? = null

              @Synchronized
              private fun conn(): Connection {
                  val existing = connection
                  if (existing != null && runCatching { !existing.isClosed && existing.isValid(2) }.getOrDefault(false)) {
                      return existing
                  }
                  runCatching { existing?.close() }
                  Class.forName("org.postgresql.Driver")
                  val props = Properties().apply {
                      setProperty("user", PgConfig.USER)
                      setProperty("password", PgConfig.PASSWORD)
                      setProperty("ssl", "false")
                      setProperty("sslmode", "disable")
                      setProperty("gssEncMode", "disable")
                      setProperty("connectTimeout", "3")
                      setProperty("loginTimeout", "5")
                      setProperty("socketTimeout", "20")
                      setProperty("tcpKeepAlive", "true")
                      setProperty("ApplicationName", "TeacherAttendance")
                  }
                  val c = DriverManager.getConnection(
                      "jdbc:postgresql://" + PgConfig.HOST + ":" + PgConfig.PORT + "/" + PgConfig.DATABASE, props
                  )
                  c.autoCommit = true
                  try {
                      verifySchema(c)
                  } catch (e: Exception) {
                      runCatching { c.close() }
                      throw e
                  }
                  connection = c
                  return c
              }

              // Returns null when the backend is ready, otherwise a readable error message.
              fun checkConnection(): String? = try {
                  conn()
                  null
              } catch (e: Throwable) {
                  e.message ?: e.javaClass.simpleName
              }

              // The app does not create its backend. It only checks that the tables exist.
              private fun verifySchema(c: Connection) {
                  val missing = BackendSpec.tableNames.filter { t ->
                      !c.rows("SELECT to_regclass(CAST(? AS text)) IS NOT NULL", t) { it.getBoolean(1) }.first()
                  }
                  if (missing.isNotEmpty()) {
                      throw IllegalStateException("Backend tables missing: " + missing.joinToString(", "))
                  }
              }

              // ---------- small JDBC helpers ----------
              private fun Connection.exec(sql: String, vararg args: Any?): Int =
                  prepareStatement(sql).use { ps ->
                      args.forEachIndexed { i, a -> ps.setObject(i + 1, a) }
                      ps.executeUpdate()
                  }

              private fun <T> Connection.rows(sql: String, vararg args: Any?, map: (ResultSet) -> T): List<T> {
                  val out = mutableListOf<T>()
                  prepareStatement(sql).use { ps ->
                      args.forEachIndexed { i, a -> ps.setObject(i + 1, a) }
                      ps.executeQuery().use { rs -> while (rs.next()) out.add(map(rs)) }
                  }
                  return out
              }

              private fun <T> transaction(block: (Connection) -> T): T {
                  val c = conn()
                  c.autoCommit = false
                  try {
                      val result = block(c)
                      c.commit()
                      return result
                  } catch (e: Exception) {
                      runCatching { c.rollback() }
                      throw e
                  } finally {
                      c.autoCommit = true
                  }
              }

              private fun teacher(rs: ResultSet) =
                  Teacher(rs.getLong(1), rs.getString(2), rs.getString(3), rs.getString(4))

              // ---------- Counts ----------
              fun getCounts(): Triple<Int, Int, Int> {
                  val c = conn()
                  fun count(table: String): Int = c.rows("SELECT COUNT(*) FROM " + table) { it.getInt(1) }.first()
                  return Triple(count("tblTeachers"), count("tblAttendanceEnrollment"), count("tblAttendanceRecords"))
              }

              // ---------- Table 1: teachers ----------
              fun getTeachers(sessionPrefix: String): List<Teacher> {
                  val select = "SELECT RecordID, TeacherName, FatherHusbandName, AppointmentSession FROM tblTeachers"
                  val order = " ORDER BY LOWER(TeacherName)"
                  return if (sessionPrefix.isBlank()) {
                      conn().rows(select + order) { teacher(it) }
                  } else {
                      conn().rows(select + " WHERE AppointmentSession LIKE ?" + order, sessionPrefix + "%") { teacher(it) }
                  }
              }

              // Teachers appointed in or before the given session
              fun getEligibleTeachers(session: String): List<Teacher> =
                  conn().rows(
                      "SELECT RecordID, TeacherName, FatherHusbandName, AppointmentSession FROM tblTeachers " +
                          "WHERE AppointmentSession COLLATE \"C\" <= ? ORDER BY LOWER(TeacherName)",
                      session
                  ) { teacher(it) }

              fun insertTeacher(name: String, fatherName: String, session: String): Long =
                  conn().rows(
                      "INSERT INTO tblTeachers (TeacherName, FatherHusbandName, AppointmentSession) " +
                          "VALUES (?, ?, ?) RETURNING RecordID",
                      name, fatherName, session
                  ) { it.getLong(1) }.first()

              fun updateTeacher(recordId: Long, name: String, fatherName: String, session: String) {
                  conn().exec(
                      "UPDATE tblTeachers SET TeacherName = ?, FatherHusbandName = ?, AppointmentSession = ? WHERE RecordID = ?",
                      name, fatherName, session, recordId
                  )
              }

              // Deletes the teacher AND all dependent rows in table 2 and table 3
              fun deleteTeacher(recordId: Long) {
                  transaction { c ->
                      c.exec("DELETE FROM tblAttendanceRecords WHERE AttendanceRecordIDFK = ?", recordId)
                      c.exec("DELETE FROM tblAttendanceEnrollment WHERE EnrollmentRecordIDFK = ?", recordId)
                      c.exec("DELETE FROM tblTeachers WHERE RecordID = ?", recordId)
                  }
              }

              // ---------- Table 2: enrolment ----------
              fun enrol(recordIds: List<Long>, session: String, months: List<Int>): Int =
                  transaction { c ->
                      var added = 0
                      for (id in recordIds) {
                          for (m in months) {
                              added += c.exec(
                                  "INSERT INTO tblAttendanceEnrollment " +
                                      "(EnrollmentRecordIDFK, AttendanceEnrollmentSession, AttendanceEnrollmentMonth) " +
                                      "VALUES (?, ?, ?) " +
                                      "ON CONFLICT (EnrollmentRecordIDFK, AttendanceEnrollmentSession, AttendanceEnrollmentMonth) DO NOTHING",
                                  id, session, m
                              )
                          }
                      }
                      added
                  }

              fun getEnrolledIds(session: String, month: Int): Set<Long> =
                  conn().rows(
                      "SELECT EnrollmentRecordIDFK FROM tblAttendanceEnrollment " +
                          "WHERE AttendanceEnrollmentSession = ? AND AttendanceEnrollmentMonth = ?",
                      session, month
                  ) { it.getLong(1) }.toSet()

              fun getEnrolledTeachers(session: String, month: Int): List<EnrolledTeacher> =
                  conn().rows(
                      "SELECT e.EnrollmentID, t.RecordID, t.TeacherName, t.FatherHusbandName " +
                          "FROM tblAttendanceEnrollment e JOIN tblTeachers t ON t.RecordID = e.EnrollmentRecordIDFK " +
                          "WHERE e.AttendanceEnrollmentSession = ? AND e.AttendanceEnrollmentMonth = ? " +
                          "ORDER BY LOWER(t.TeacherName)",
                      session, month
                  ) { EnrolledTeacher(it.getLong(1), it.getLong(2), it.getString(3), it.getString(4)) }

              // Teachers enrolled in at least one month of the session
              fun getTeachersEnrolledInSession(session: String): List<Teacher> =
                  conn().rows(
                      "SELECT t.RecordID, t.TeacherName, t.FatherHusbandName, t.AppointmentSession " +
                          "FROM tblAttendanceEnrollment e JOIN tblTeachers t ON t.RecordID = e.EnrollmentRecordIDFK " +
                          "WHERE e.AttendanceEnrollmentSession = ? " +
                          "GROUP BY t.RecordID, t.TeacherName, t.FatherHusbandName, t.AppointmentSession " +
                          "ORDER BY LOWER(t.TeacherName)",
                      session
                  ) { teacher(it) }

              // ---------- Table 3: attendance records ----------
              // Returns enrollmentId -> status for one full date (yyyy-MM-dd)
              fun getAttendanceForDate(session: String, date: String): Map<Long, String> =
                  conn().rows(
                      "SELECT r.AttendanceEnrollmentIDFK, r.AttendanceStatus " +
                          "FROM tblAttendanceRecords r JOIN tblAttendanceEnrollment e ON e.EnrollmentID = r.AttendanceEnrollmentIDFK " +
                          "WHERE e.AttendanceEnrollmentSession = ? AND r.AttendanceDate = ?",
                      session, date
                  ) { Pair(it.getLong(1), it.getString(2)) }.toMap()

              // "P" (present) removes any record for that date; other statuses are stored
              fun saveAttendanceDate(date: String, enrolled: List<EnrolledTeacher>, statuses: Map<Long, String>) {
                  transaction { c ->
                      for (t in enrolled) {
                          val st = statuses[t.enrollmentId] ?: "P"
                          if (st == "P") {
                              c.exec(
                                  "DELETE FROM tblAttendanceRecords WHERE AttendanceEnrollmentIDFK = ? AND AttendanceDate = ?",
                                  t.enrollmentId, date
                              )
                          } else {
                              c.exec(
                                  "INSERT INTO tblAttendanceRecords " +
                                      "(AttendanceRecordIDFK, AttendanceEnrollmentIDFK, AttendanceDate, AttendanceStatus) " +
                                      "VALUES (?, ?, ?, ?) " +
                                      "ON CONFLICT (AttendanceEnrollmentIDFK, AttendanceDate) DO UPDATE SET " +
                                      "AttendanceStatus = EXCLUDED.AttendanceStatus, " +
                                      "AttendanceRecordIDFK = EXCLUDED.AttendanceRecordIDFK",
                                  t.recordId, t.enrollmentId, date, st
                              )
                          }
                      }
                  }
              }

              // Deletes ONLY attendance records of one teacher (basic info and enrolments stay)
              fun deleteAttendanceRecords(recordId: Long, session: String, month: Int?): Int {
                  val sub = "SELECT EnrollmentID FROM tblAttendanceEnrollment WHERE AttendanceEnrollmentSession = ?" +
                      (if (month != null) " AND AttendanceEnrollmentMonth = ?" else "")
                  val args = mutableListOf<Any?>(recordId, session)
                  if (month != null) args.add(month)
                  return conn().exec(
                      "DELETE FROM tblAttendanceRecords WHERE AttendanceRecordIDFK = ? AND AttendanceEnrollmentIDFK IN (" + sub + ")",
                      *args.toTypedArray()
                  )
              }

              // All records of a session between two full dates (inclusive), used for printing
              fun getAttendanceBetween(session: String, fromDate: String, toDate: String): List<PrintRow> =
                  conn().rows(
                      "SELECT r.AttendanceDate, t.TeacherName, t.FatherHusbandName, r.AttendanceStatus " +
                          "FROM tblAttendanceRecords r " +
                          "JOIN tblAttendanceEnrollment e ON e.EnrollmentID = r.AttendanceEnrollmentIDFK " +
                          "JOIN tblTeachers t ON t.RecordID = r.AttendanceRecordIDFK " +
                          "WHERE e.AttendanceEnrollmentSession = ? AND r.AttendanceDate BETWEEN ? AND ? " +
                          "ORDER BY r.AttendanceDate, LOWER(t.TeacherName)",
                      session, fromDate, toDate
                  ) { PrintRow(it.getString(1), it.getString(2), it.getString(3), it.getString(4)) }

              // ---------- Report ----------
              fun getMonthlyReport(session: String, month: Int): List<ReportRow> =
                  conn().rows(
                      "SELECT t.TeacherName, t.FatherHusbandName, " +
                          "SUM(CASE WHEN r.AttendanceStatus = 'ABSENT' THEN 1 ELSE 0 END), " +
                          "SUM(CASE WHEN r.AttendanceStatus = 'LATE' THEN 1 ELSE 0 END), " +
                          "SUM(CASE WHEN r.AttendanceStatus = 'HALF_DAY' THEN 1 ELSE 0 END), " +
                          "SUM(CASE WHEN r.AttendanceStatus = 'LEAVE' THEN 1 ELSE 0 END) " +
                          "FROM tblAttendanceEnrollment e " +
                          "JOIN tblTeachers t ON t.RecordID = e.EnrollmentRecordIDFK " +
                          "LEFT JOIN tblAttendanceRecords r ON r.AttendanceEnrollmentIDFK = e.EnrollmentID " +
                          "WHERE e.AttendanceEnrollmentSession = ? AND e.AttendanceEnrollmentMonth = ? " +
                          "GROUP BY e.EnrollmentID, t.RecordID, t.TeacherName, t.FatherHusbandName " +
                          "ORDER BY LOWER(t.TeacherName)",
                      session, month
                  ) { ReportRow(it.getString(1), it.getString(2), it.getInt(3), it.getInt(4), it.getInt(5), it.getInt(6)) }

              // ---------- Backup / restore (all three tables, same JSON format as the old SQLite version) ----------
              fun getBackup(): BackupData {
                  val c = conn()
                  val teachers = c.rows("SELECT RecordID, TeacherName, FatherHusbandName, AppointmentSession FROM tblTeachers") {
                      TeacherRow(it.getLong(1), it.getString(2), it.getString(3), it.getString(4))
                  }
                  val enrollments = c.rows(
                      "SELECT EnrollmentID, EnrollmentRecordIDFK, AttendanceEnrollmentSession, AttendanceEnrollmentMonth FROM tblAttendanceEnrollment"
                  ) { EnrollmentRow(it.getLong(1), it.getLong(2), it.getString(3), it.getInt(4)) }
                  val attendance = c.rows(
                      "SELECT AttendanceID, AttendanceRecordIDFK, AttendanceEnrollmentIDFK, AttendanceDate, AttendanceStatus FROM tblAttendanceRecords"
                  ) { AttendanceRow(it.getLong(1), it.getLong(2), it.getLong(3), it.getString(4), it.getString(5)) }
                  return BackupData(3, teachers, enrollments, attendance)
              }

              // Replaces ALL current data with the backup
              fun restoreBackup(data: BackupData) {
                  transaction { c ->
                      c.exec("DELETE FROM tblAttendanceRecords")
                      c.exec("DELETE FROM tblAttendanceEnrollment")
                      c.exec("DELETE FROM tblTeachers")
                      for (t in data.teachers.orEmpty()) {
                          c.exec(
                              "INSERT INTO tblTeachers (RecordID, TeacherName, FatherHusbandName, AppointmentSession) VALUES (?, ?, ?, ?)",
                              t.recordId, t.name, t.fatherName, t.appointmentSession
                          )
                      }
                      for (e in data.enrollments.orEmpty()) {
                          c.exec(
                              "INSERT INTO tblAttendanceEnrollment (EnrollmentID, EnrollmentRecordIDFK, AttendanceEnrollmentSession, AttendanceEnrollmentMonth) VALUES (?, ?, ?, ?)",
                              e.enrollmentId, e.teacherId, e.session, e.month
                          )
                      }
                      for (a in data.attendance.orEmpty()) {
                          c.exec(
                              "INSERT INTO tblAttendanceRecords (AttendanceID, AttendanceRecordIDFK, AttendanceEnrollmentIDFK, AttendanceDate, AttendanceStatus) VALUES (?, ?, ?, ?, ?)",
                              a.attendanceId, a.teacherId, a.enrollmentId, a.date, a.status
                          )
                      }
                      resetSequence(c, "tblTeachers", "recordid", "RecordID")
                      resetSequence(c, "tblAttendanceEnrollment", "enrollmentid", "EnrollmentID")
                      resetSequence(c, "tblAttendanceRecords", "attendanceid", "AttendanceID")
                  }
              }

              // After restoring explicit IDs, the next automatic ID must continue after the highest one
              private fun resetSequence(c: Connection, table: String, seqColumn: String, column: String) {
                  c.rows(
                      "SELECT setval(pg_get_serial_sequence('" + table + "', '" + seqColumn + "'), " +
                          "COALESCE((SELECT MAX(" + column + ") FROM " + table + "), 0) + 1, false)"
                  ) { it.getLong(1) }
              }
          }
          EOF

          # 7. Common.kt (constants, session mask, date helpers, shared controls)
          cat << 'EOF' > app/src/main/java/com/school/teacherrecords/Common.kt
          @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)

          package com.school.teacherrecords

          import android.app.DatePickerDialog
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.SpanStyle
          import androidx.compose.ui.text.buildAnnotatedString
          import androidx.compose.ui.text.input.OffsetMapping
          import androidx.compose.ui.text.input.TransformedText
          import androidx.compose.ui.text.input.VisualTransformation
          import androidx.compose.ui.text.withStyle
          import androidx.compose.ui.unit.dp
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          val MONTHS = listOf(
              "January", "February", "March", "April", "May", "June",
              "July", "August", "September", "October", "November", "December"
          )

          const val ST_PRESENT = "P"
          const val ST_ABSENT = "ABSENT"
          const val ST_LATE = "LATE"
          const val ST_HALF = "HALF_DAY"
          const val ST_LEAVE = "LEAVE"

          // ---------- Date helpers (stored as yyyy-MM-dd, shown as dd-MM-yyyy) ----------
          fun todayIso(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())

          fun firstOfMonthIso(): String {
              val c = Calendar.getInstance()
              c.set(Calendar.DAY_OF_MONTH, 1)
              return SimpleDateFormat("yyyy-MM-dd", Locale.US).format(c.time)
          }

          fun displayDate(iso: String): String {
              val p = iso.split("-")
              return if (p.size == 3) "${p[2]}-${p[1]}-${p[0]}" else iso
          }

          fun monthOfIso(iso: String): Int = iso.substring(5, 7).toInt()

          @Composable
          fun DateField(label: String, value: String, onChange: (String) -> Unit) {
              val context = LocalContext.current
              OutlinedButton(
                  onClick = {
                      val cal = Calendar.getInstance()
                      val p = value.split("-")
                      if (p.size == 3) {
                          cal.set(p[0].toInt(), p[1].toInt() - 1, p[2].toInt())
                      }
                      DatePickerDialog(
                          context,
                          { _, y, m, d -> onChange(String.format(Locale.US, "%04d-%02d-%02d", y, m + 1, d)) },
                          cal.get(Calendar.YEAR),
                          cal.get(Calendar.MONTH),
                          cal.get(Calendar.DAY_OF_MONTH)
                      ).show()
                  },
                  modifier = Modifier.fillMaxWidth()
              ) { Text("$label: ${displayDate(value)}") }
          }

          // ---------- Session mask 0000/00 ----------
          fun formatSessionInput(raw: String): String {
              val d = raw.filter { it.isDigit() }.take(6)
              return if (d.length > 4) d.substring(0, 4) + "/" + d.substring(4) else d
          }

          fun isValidSession(s: String): Boolean {
              if (s.length != 7 || s[4] != '/') return false
              val a = s.substring(0, 4)
              val b = s.substring(5)
              if (!a.all { it.isDigit() } || !b.all { it.isDigit() }) return false
              return b.toInt() == (a.toInt() + 1) % 100
          }

          // Shows the mask 0000/00 permanently: typed digits are black, the rest stay grey.
          // The cursor always sits right after the last typed digit.
          private class SessionMaskTransformation : VisualTransformation {
              override fun filter(text: AnnotatedString): TransformedText {
                  val d = text.text.take(6)
                  val shown = buildAnnotatedString {
                      for (i in 0 until 6) {
                          if (i == 4) append("/")
                          if (i < d.length) {
                              append(d[i])
                          } else {
                              withStyle(SpanStyle(color = Color.Gray)) { append('0') }
                          }
                      }
                  }
                  val mapping = object : OffsetMapping {
                      override fun originalToTransformed(offset: Int): Int =
                          if (offset < 4) offset else offset + 1

                      override fun transformedToOriginal(offset: Int): Int {
                          val o = if (offset <= 4) offset else offset - 1
                          return o.coerceAtMost(d.length)
                      }
                  }
                  return TransformedText(shown, mapping)
              }
          }

          @Composable
          fun SessionField(
              value: String,
              onValueChange: (String) -> Unit,
              label: String = "Session (0000/00)",
              modifier: Modifier = Modifier.fillMaxWidth()
          ) {
              val bad = value.length == 7 && !isValidSession(value)
              OutlinedTextField(
                  value = value.filter { it.isDigit() },
                  onValueChange = { onValueChange(formatSessionInput(it)) },
                  label = { Text(label) },
                  singleLine = true,
                  visualTransformation = remember { SessionMaskTransformation() },
                  keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                  isError = bad,
                  supportingText = { if (bad) Text("Second part must be the next year, e.g. 2026/27") },
                  modifier = modifier
              )
          }

          @Composable
          fun DropdownField(
              label: String,
              options: List<String>,
              selectedIndex: Int,
              modifier: Modifier = Modifier.fillMaxWidth(),
              onSelect: (Int) -> Unit
          ) {
              var expanded by remember { mutableStateOf(false) }
              ExposedDropdownMenuBox(
                  expanded = expanded,
                  onExpandedChange = { expanded = !expanded },
                  modifier = modifier
              ) {
                  OutlinedTextField(
                      value = options.getOrElse(selectedIndex) { "" },
                      onValueChange = {},
                      readOnly = true,
                      label = { Text(label) },
                      trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded = expanded) },
                      modifier = Modifier.menuAnchor().fillMaxWidth()
                  )
                  ExposedDropdownMenu(expanded = expanded, onDismissRequest = { expanded = false }) {
                      options.forEachIndexed { i, o ->
                          DropdownMenuItem(
                              text = { Text(o) },
                              onClick = {
                                  onSelect(i)
                                  expanded = false
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun ScreenFrame(title: String, onBack: () -> Unit, content: @Composable ColumnScope.() -> Unit) {
