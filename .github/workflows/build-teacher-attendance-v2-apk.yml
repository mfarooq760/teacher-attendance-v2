                      appendLine("sleep 3")
                      appendLine("psql -d postgres -tc \"SELECT 1 FROM pg_roles WHERE rolname='" + USER + "'\" | grep -q 1 || psql -d postgres -c \"CREATE ROLE " + USER + " LOGIN PASSWORD '" + PASSWORD + "'\"")
                      appendLine("psql -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='" + DATABASE + "'\" | grep -q 1 || createdb -O " + USER + " " + DATABASE)
                      appendLine("psql -U " + USER + " -d " + DATABASE + " <<'SQL'")
                      tables.forEach { appendLine(it.createSql()) }
                      appendLine("SQL")
                      appendLine("psql -U " + USER + " -d " + DATABASE + " -c \"\\dt\"")
                  }
              }
          }

