                      )

                      MenuButton("Save Attendance for ${isoToDisplay(dateIso)}", "btnSaveAttendance") {
                          db.saveAttendanceDay(dateIso, enrolled, statuses.toMap())
                          tick++
                          Toast.makeText(context, "Attendance saved", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }

          @Composable
          fun PrintAttendanceScreen(db: DatabaseHelper, onBack: () -> Unit) {
              val context = LocalContext.current
              var session by remember { mutableStateOf("") }
              var fromDate by remember { mutableStateOf(firstOfMonthIso()) }
              var toDate by remember { mutableStateOf(todayIso()) }
              val valid = isValidSession(session)
              val rangeOk = fromDate <= toDate
              val rows = remember(session, fromDate, toDate) {
                  if (valid && rangeOk) db.getAttendanceBetween(session, fromDate, toDate) else emptyList()
              }

              ScreenFrame("Print Attendance", onBack) {
                  SessionField(session, { session = it }, "Attendance Session (0000/00)")
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedButton(
                          onClick = { pickDate(context, fromDate) { fromDate = it } },
                          modifier = Modifier.weight(1f)
                      ) { Text("From: ${isoToDisplay(fromDate)}") }
                      OutlinedButton(
                          onClick = { pickDate(context, toDate) { toDate = it } },
                          modifier = Modifier.weight(1f)
                      ) { Text("To: ${isoToDisplay(toDate)}") }
                  }

                  if (!rangeOk) {
                      Text("The From date must not be after the To date.", color = RED)
                  }

                  if (!valid) {
                      Text("Type a complete session (for example 2026/27).", color = Color.Gray)
                  } else if (rangeOk) {
                      Text("Records found: ${rows.size}", fontWeight = FontWeight.Bold)
                      if (rows.isNotEmpty()) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(Color(0xFFE0E0E0))
                                  .padding(8.dp)
                          ) {
                              Text("Date", Modifier.weight(2f), fontWeight = FontWeight.Bold)
                              Text("Teacher", Modifier.weight(3f), fontWeight = FontWeight.Bold)
                              Text("Status", Modifier.weight(2f), fontWeight = FontWeight.Bold)
                          }
                          rows.forEach { r ->
                              Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 8.dp)) {
                                  Text(isoToDisplay(r.date), Modifier.weight(2f))
                                  Text(r.name, Modifier.weight(3f))
                                  Text(statusLabel(r.status), Modifier.weight(2f))
                              }
                              HorizontalDivider()
                          }
                      }
                      MenuButton("Print Attendance", "btnPrintAttendance") {
                          try {
                              printAttendance(context, session, fromDate, toDate, rows)
                          } catch (e: Exception) {
                              Toast.makeText(context, "Print failed: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }
          }

          @Composable
          fun DeleteTeacherScreen(db: DatabaseHelper, onBack: () -> Unit) {
              val context = LocalContext.current
              var filter by remember { mutableStateOf("") }
              var tick by remember { mutableIntStateOf(0) }
              var toDelete by remember { mutableStateOf<Teacher?>(null) }
              val teachers = remember(filter, tick) { db.getTeachers(filter) }

              ScreenFrame("Delete Teacher", onBack) {
                  SessionField(filter, { filter = it }, "Filter by Appointment Session (0000/00)")
                  Text("Teachers (${teachers.size})", fontWeight = FontWeight.Bold)
                  if (teachers.isEmpty()) Text("No teachers found.", color = Color.Gray)
                  teachers.forEach { t ->
                      Card(modifier = Modifier.fillMaxWidth()) {
                          Row(
                              modifier = Modifier.padding(12.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(t.name, fontWeight = FontWeight.Bold)
                                  Text("${t.fatherName}  |  ${t.appointmentSession}", color = Color.Gray)
                              }
                              TextButton(onClick = { toDelete = t }) { Text("Delete", color = RED) }
                          }
                      }
                  }

                  toDelete?.let { t ->
                      AlertDialog(
                          onDismissRequest = { toDelete = null },
                          title = { Text("Delete teacher?") },
                          text = {
                              Text(
                                  "${t.name} and ALL of this teacher's enrolment and attendance records will be " +
                                      "permanently deleted."
                              )
                          },
                          confirmButton = {
                              Button(
                                  onClick = {
                                      db.deleteTeacher(t.recordId)
                                      toDelete = null
                                      tick++
                                      Toast.makeText(context, "Teacher deleted", Toast.LENGTH_SHORT).show()
                                  },
                                  colors = ButtonDefaults.buttonColors(containerColor = RED)
                              ) { Text("Delete") }
                          },
                          dismissButton = { TextButton(onClick = { toDelete = null }) { Text("Cancel") } }
                      )
                  }
              }
          }

          @Composable
          fun DeleteAttendanceScreen(db: DatabaseHelper, onBack: () -> Unit) {
              val context = LocalContext.current
              var session by remember { mutableStateOf("") }
              var monthIdx by remember { mutableIntStateOf(0) }
              var selected by remember { mutableStateOf<Teacher?>(null) }
              var confirm by remember { mutableStateOf(false) }
              var tick by remember { mutableIntStateOf(0) }
              val valid = isValidSession(session)
              val monthOptions = remember { listOf("All months") + MONTHS }
              val teachers = remember(session, tick) {
                  if (valid) db.getTeachersEnrolledInSession(session) else emptyList()
              }

              LaunchedEffect(session) { selected = null }

              ScreenFrame("Delete Attendance Records", onBack) {
                  SessionField(session, { session = it }, "Attendance Session (0000/00)")
                  DropdownField("Month to clear", monthOptions, monthIdx) { monthIdx = it }

                  if (!valid) {
                      Text("Type a complete session (for example 2026/27).", color = Color.Gray)
                  } else if (teachers.isEmpty()) {
                      Text("No enrolled teachers found for session $session.", color = Color.Gray)
                  } else {
                      Text("Select the teacher", fontWeight = FontWeight.Bold)
                      teachers.forEach { t ->
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clickable { selected = t },
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              RadioButton(selected = selected?.recordId == t.recordId, onClick = { selected = t })
                              Column {
                                  Text(t.name, fontWeight = FontWeight.SemiBold)
                                  Text(t.fatherName, color = Color.Gray)
                              }
                          }
                      }
                      Text("Only attendance records are deleted. The teacher and enrolments stay.", color = Color.Gray)
                      MenuButton("Delete Attendance Records", "btnDeleteTeacherAttendanceRecordNow", danger = true) {
                          if (selected == null) {
                              Toast.makeText(context, "Select a teacher first", Toast.LENGTH_SHORT).show()
                          } else {
                              confirm = true
                          }
                      }
                  }

                  val sel = selected
                  if (confirm && sel != null) {
                      AlertDialog(
                          onDismissRequest = { confirm = false },
                          title = { Text("Delete attendance records?") },
                          text = {
                              Text(
                                  "All absent / late / half day / leave records of ${sel.name} for session $session (" +
                                      monthOptions[monthIdx] + ") will be deleted."
                              )
                          },
                          confirmButton = {
                              Button(
                                  onClick = {
                                      val n = db.deleteAttendanceRecords(
                                          sel.recordId, session, if (monthIdx == 0) null else monthIdx
                                      )
                                      confirm = false
                                      tick++
                                      Toast.makeText(context, "$n record(s) deleted", Toast.LENGTH_SHORT).show()
                                  },
                                  colors = ButtonDefaults.buttonColors(containerColor = RED)
                              ) { Text("Delete") }
                          },
                          dismissButton = { TextButton(onClick = { confirm = false }) { Text("Cancel") } }
                      )
                  }
              }
          }

          @Composable
          fun ReportScreen(db: DatabaseHelper, onBack: () -> Unit) {
              val context = LocalContext.current
              var session by remember { mutableStateOf("") }
              var monthIdx by remember { mutableIntStateOf(0) }
              var tick by remember { mutableIntStateOf(0) }
              var pendingRestore by remember { mutableStateOf<Uri?>(null) }
              val valid = isValidSession(session)
              val rows = remember(session, monthIdx, tick) {
                  if (valid) db.getMonthlyReport(session, monthIdx + 1) else emptyList()
              }

              val restoreLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? -> if (uri != null) pendingRestore = uri }

              ScreenFrame("Monthly Report", onBack) {
                  SessionField(session, { session = it }, "Attendance Session (0000/00)")
                  DropdownField("Month", MONTHS, monthIdx) { monthIdx = it }

                  if (!valid) {
                      Text("Type a complete session (for example 2026/27).", color = Color.Gray)
                  } else if (rows.isEmpty()) {
                      Text("No enrolled teachers for ${MONTHS[monthIdx]} $session.", color = Color.Gray)
                  } else {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xFFE0E0E0))
                              .padding(8.dp)
                      ) {
                          Text("Teacher", Modifier.weight(3f), fontWeight = FontWeight.Bold)
                          Text("A", Modifier.weight(1f), fontWeight = FontWeight.Bold)
                          Text("L", Modifier.weight(1f), fontWeight = FontWeight.Bold)
                          Text("HD", Modifier.weight(1f), fontWeight = FontWeight.Bold)
                          Text("LV", Modifier.weight(1f), fontWeight = FontWeight.Bold)
                      }
                      rows.forEach { r ->
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(horizontal = 8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(3f)) {
                                  Text(r.name, fontWeight = FontWeight.SemiBold)
                                  Text(r.fatherName, color = Color.Gray)
                              }
                              Text("${r.absent}", Modifier.weight(1f), color = Color(0xFFC62828), fontWeight = FontWeight.Bold)
                              Text("${r.late}", Modifier.weight(1f), color = Color(0xFF1565C0), fontWeight = FontWeight.Bold)
                              Text("${r.halfDay}", Modifier.weight(1f), color = Color(0xFF6A1B9A), fontWeight = FontWeight.Bold)
                              Text("${r.leave}", Modifier.weight(1f), color = Color(0xFFEF6C00), fontWeight = FontWeight.Bold)
                          }
                          HorizontalDivider()
                      }
                      Button(
                          onClick = { exportReportCsv(context, session, monthIdx + 1, rows) },
                          modifier = Modifier.fillMaxWidth()
                      ) { Text("Export CSV") }
                  }

                  HorizontalDivider()
                  Text("Backup / Restore (all three tables)", fontWeight = FontWeight.Bold)
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = {
                              try {
                                  exportBackup(context, db)
                              } catch (e: Exception) {
                                  Toast.makeText(context, "Backup failed: ${e.message}", Toast.LENGTH_LONG).show()
                              }
                          },
                          modifier = Modifier.weight(1f)
                      ) { Text("Backup") }
                      OutlinedButton(
                          onClick = { restoreLauncher.launch("*/*") },
                          modifier = Modifier.weight(1f)
                      ) { Text("Restore") }
                  }

                  pendingRestore?.let { uri ->
                      AlertDialog(
                          onDismissRequest = { pendingRestore = null },
                          title = { Text("Restore backup?") },
                          text = {
                              Text("This REPLACES all current teachers, enrolments and attendance records with the backup file.")
                          },
                          confirmButton = {
                              Button(onClick = {
                                  try {
                                      val json = context.contentResolver.openInputStream(uri)
                                          ?.bufferedReader()?.use { it.readText() }
                                          ?: throw Exception("Cannot read the file")
                                      val data = Gson().fromJson(json, BackupData::class.java)
                                      if (data == null || data.version != 3) {
                                          throw Exception("Not a backup file of this version")
                                      }
                                      db.restoreBackup(data)
                                      tick++
                                      Toast.makeText(context, "Records restored successfully!", Toast.LENGTH_SHORT).show()
                                  } catch (e: Exception) {
                                      Toast.makeText(context, "Failed to restore: ${e.message}", Toast.LENGTH_LONG).show()
                                  }
                                  pendingRestore = null
                              }) { Text("Restore") }
                          },
                          dismissButton = { TextButton(onClick = { pendingRestore = null }) { Text("Cancel") } }
                      )
                  }
              }
          }

          private fun csvCell(s: String): String = "\"" + s.replace("\"", "\"\"") + "\""

          fun exportReportCsv(context: Context, session: String, month: Int, rows: List<ReportRow>) {
              val fileName = "Attendance_${session.replace("/", "-")}_${month}.csv"
              val file = File(context.cacheDir, fileName)
              val sb = StringBuilder("Teacher Name,Father/Husband Name,Session,Month,Absent,Late,Half Day,Leave\n")
              rows.forEach {
                  sb.append(csvCell(it.name)).append(',')
                      .append(csvCell(it.fatherName)).append(',')
                      .append(session).append(',')
                      .append(MONTHS[month - 1]).append(',')
                      .append(it.absent).append(',')
                      .append(it.late).append(',')
                      .append(it.halfDay).append(',')
                      .append(it.leave).append('\n')
              }
              file.writeText(sb.toString())
              shareFile(context, file, "text/csv")
          }

          fun exportBackup(context: Context, db: DatabaseHelper) {
              val json = Gson().toJson(db.getBackup())
              val file = File(context.cacheDir, "teacher_records_backup.json")
              file.writeText(json)
              shareFile(context, file, "application/json")
          }

          fun shareFile(context: Context, file: File, mimeType: String) {
              val uri: Uri = FileProvider.getUriForFile(context, "com.school.teacherrecords.fileprovider", file)
              val intent = Intent(Intent.ACTION_SEND).apply {
                  type = mimeType
                  putExtra(Intent.EXTRA_STREAM, uri)
                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              }
              context.startActivity(Intent.createChooser(intent, "Share File"))
          }
          EOF

          # 11. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/school/teacherrecords/MainActivity.kt
          package com.school.teacherrecords

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.*

          enum class Screen { DASHBOARD, ADD_TEACHER, ENROL, ATTENDANCE, PRINT, DELETE_TEACHER, DELETE_ATTENDANCE, REPORT }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val db = DatabaseHelper(this)
                  setContent {
                      MaterialTheme {
                          AppRoot(db)
                      }
                  }
              }
          }

          @Composable
          fun AppRoot(db: DatabaseHelper) {
              var screen by remember { mutableStateOf(Screen.DASHBOARD) }
              BackHandler(enabled = screen != Screen.DASHBOARD) { screen = Screen.DASHBOARD }

              when (screen) {
                  Screen.DASHBOARD -> DashboardScreen(db) { screen = it }
                  Screen.ADD_TEACHER -> AddTeacherScreen(db) { screen = Screen.DASHBOARD }
                  Screen.ENROL -> EnrolScreen(db) { screen = Screen.DASHBOARD }
                  Screen.ATTENDANCE -> TakeAttendanceScreen(db) { screen = Screen.DASHBOARD }
                  Screen.PRINT -> PrintAttendanceScreen(db) { screen = Screen.DASHBOARD }
                  Screen.DELETE_TEACHER -> DeleteTeacherScreen(db) { screen = Screen.DASHBOARD }
                  Screen.DELETE_ATTENDANCE -> DeleteAttendanceScreen(db) { screen = Screen.DASHBOARD }
                  Screen.REPORT -> ReportScreen(db) { screen = Screen.DASHBOARD }
              }
          }
