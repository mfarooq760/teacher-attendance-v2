          # 8. AttendancePrint.kt (A4 print layout, system print + image export)
          cat << 'EOF' > app/src/main/java/com/school/teacherrecords/AttendancePrint.kt
          package com.school.teacherrecords

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.os.Bundle
          import android.os.CancellationSignal
          import android.os.ParcelFileDescriptor
          import android.print.PageRange
          import android.print.PrintAttributes
          import android.print.PrintDocumentAdapter
          import android.print.PrintDocumentInfo
          import android.print.PrintManager
          import android.print.pdf.PrintedPdfDocument
          import android.text.TextPaint
          import android.text.TextUtils
          import java.io.File
          import java.io.FileOutputStream
          import java.io.IOException

          const val SCHOOL_NAME = "Islamic International Model School"

          data class PrintRow(val date: String, val name: String, val fatherName: String, val status: String)

          fun statusLabel(s: String): String = when (s) {
              ST_ABSENT -> "Absent"
              ST_LATE -> "Late"
              ST_HALF -> "Half Day"
              ST_LEAVE -> "Leave"
              else -> s
          }

          // Lays records out on A4 portrait pages (595 x 842 points)
          class AttendanceReportLayout(
              val session: String,
              val fromIso: String,
              val toIso: String,
              private val rows: List<PrintRow>
          ) {
              companion object {
                  const val W = 595
                  const val H = 842
                  const val ROWS_PER_PAGE = 36
              }

              val pages: List<List<PrintRow>>

              init {
                  val chunks = rows.chunked(ROWS_PER_PAGE).toMutableList()
                  // keep room for the totals block on the last page
                  if (chunks.isEmpty() || chunks.last().size > ROWS_PER_PAGE - 6) chunks.add(emptyList())
                  pages = chunks
              }

              private fun tp(size: Float, bold: Boolean = false, align: Paint.Align = Paint.Align.LEFT, color: Int = Color.BLACK) =
                  TextPaint().apply {
                      isAntiAlias = true
                      textSize = size
                      this.color = color
                      textAlign = align
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }

              private val schoolPaint = tp(18f, true, Paint.Align.CENTER)
              private val titlePaint = tp(12f, true, Paint.Align.CENTER)
              private val infoPaint = tp(10.5f, false, Paint.Align.CENTER, Color.DKGRAY)
              private val headPaint = tp(10.5f, true)
              private val textPaint = tp(10.5f)
              private val footLeft = tp(9f, false, Paint.Align.LEFT, Color.GRAY)
              private val footRight = tp(9f, false, Paint.Align.RIGHT, Color.GRAY)
              private val linePaint = Paint().apply { color = Color.BLACK; strokeWidth = 1f }
              private val bgPaint = Paint().apply { color = Color.rgb(224, 224, 224) }

              private fun fit(s: String, p: TextPaint, w: Float): String =
                  TextUtils.ellipsize(s, p, w, TextUtils.TruncateAt.END).toString()

              fun drawPage(c: Canvas, index: Int) {
                  val margin = 36f
                  val right = W - margin
                  val xSr = margin + 4f
                  val xDate = 72f
                  val xName = 150f
                  val xFather = 310f
                  val xStatus = 490f

                  // Header on EVERY page
                  c.drawText(SCHOOL_NAME, W / 2f, 46f, schoolPaint)
                  c.drawText("Teacher Attendance Report", W / 2f, 66f, titlePaint)
                  c.drawText(
                      "Session: $session     From: ${displayDate(fromIso)}     To: ${displayDate(toIso)}",
                      W / 2f, 84f, infoPaint
                  )
                  c.drawLine(margin, 94f, right, 94f, linePaint)

                  // Column headings
                  c.drawRect(margin, 100f, right, 120f, bgPaint)
                  c.drawText("Sr", xSr, 114f, headPaint)
                  c.drawText("Date", xDate, 114f, headPaint)
                  c.drawText("Teacher Name", xName, 114f, headPaint)
                  c.drawText("Father / Husband", xFather, 114f, headPaint)
                  c.drawText("Status", xStatus, 114f, headPaint)

                  var y = 136f
                  val chunk = pages[index]
                  chunk.forEachIndexed { i, r ->
                      c.drawText("${index * ROWS_PER_PAGE + i + 1}", xSr, y, textPaint)
                      c.drawText(displayDate(r.date), xDate, y, textPaint)
                      c.drawText(fit(r.name, textPaint, xFather - xName - 8f), xName, y, textPaint)
                      c.drawText(fit(r.fatherName, textPaint, xStatus - xFather - 8f), xFather, y, textPaint)
                      c.drawText(statusLabel(r.status), xStatus, y, textPaint)
                      y += 18f
                  }

                  if (index == pages.size - 1) {
                      if (rows.isEmpty()) {
                          c.drawText("No attendance records found for the selected filter.", xSr, y, textPaint)
                      } else {
                          y += 6f
                          c.drawLine(margin, y, right, y, linePaint)
                          y += 18f
                          c.drawText("Total records: ${rows.size}", xSr, y, headPaint)
                          y += 16f
                          c.drawText(
                              "Absent: ${rows.count { it.status == ST_ABSENT }}     " +
                                  "Late: ${rows.count { it.status == ST_LATE }}     " +
                                  "Half Day: ${rows.count { it.status == ST_HALF }}     " +
                                  "Leave: ${rows.count { it.status == ST_LEAVE }}",
                              xSr, y, textPaint
                          )
                      }
                  }

                  // Footer
                  c.drawText("Printed on: ${displayDate(todayIso())}", margin, H - 20f, footLeft)
                  c.drawText("Page ${index + 1} of ${pages.size}", right, H - 20f, footRight)
              }
          }

          // ---------- System print (choose printer or "Save as PDF") ----------
          class AttendancePrintAdapter(
              private val context: Context,
              private val report: AttendanceReportLayout
          ) : PrintDocumentAdapter() {

              private var attrs: PrintAttributes? = null

              override fun onLayout(
                  oldAttributes: PrintAttributes?,
                  newAttributes: PrintAttributes,
                  cancellationSignal: CancellationSignal?,
                  callback: LayoutResultCallback,
                  extras: Bundle?
              ) {
                  if (cancellationSignal?.isCanceled == true) {
                      callback.onLayoutCancelled()
                      return
                  }
                  attrs = newAttributes
                  val info = PrintDocumentInfo.Builder("Teacher_Attendance_Report.pdf")
                      .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)
                      .setPageCount(report.pages.size)
                      .build()
                  callback.onLayoutFinished(info, true)
              }

              override fun onWrite(
                  pages: Array<out PageRange>?,
                  destination: ParcelFileDescriptor,
                  cancellationSignal: CancellationSignal?,
                  callback: WriteResultCallback
              ) {
                  val a = attrs
                  if (a == null) {
                      callback.onWriteFailed("Layout missing")
                      return
                  }
                  val doc = PrintedPdfDocument(context, a)
                  try {
                      for (i in report.pages.indices) {
                          if (cancellationSignal?.isCanceled == true) {
                              callback.onWriteCancelled()
                              return
                          }
                          val page = doc.startPage(i)
                          val sc = page.info.pageWidth / AttendanceReportLayout.W.toFloat()
                          page.canvas.scale(sc, sc)
                          report.drawPage(page.canvas, i)
                          doc.finishPage(page)
                      }
                      doc.writeTo(FileOutputStream(destination.fileDescriptor))
                      callback.onWriteFinished(arrayOf(PageRange.ALL_PAGES))
                  } catch (e: IOException) {
                      callback.onWriteFailed(e.toString())
                  } finally {
                      doc.close()
                  }
              }
          }

          fun printAttendance(context: Context, report: AttendanceReportLayout) {
              val pm = context.getSystemService(Context.PRINT_SERVICE) as PrintManager
              val attrs = PrintAttributes.Builder()
                  .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                  .build()
              pm.print("Teacher Attendance Report", AttendancePrintAdapter(context, report), attrs)
          }

          // ---------- Same report as JPG pages (for sharing in a group) ----------
          fun renderAttendanceImages(context: Context, report: AttendanceReportLayout): List<File> {
              val scale = 2.5f
              val files = mutableListOf<File>()
              for (i in report.pages.indices) {
                  val bmp = Bitmap.createBitmap(
                      (AttendanceReportLayout.W * scale).toInt(),
                      (AttendanceReportLayout.H * scale).toInt(),
                      Bitmap.Config.ARGB_8888
                  )
                  val c = Canvas(bmp)
                  c.drawColor(Color.WHITE)
                  c.scale(scale, scale)
                  report.drawPage(c, i)
                  val f = File(context.cacheDir, "Teacher_Attendance_p${i + 1}.jpg")
                  FileOutputStream(f).use { bmp.compress(Bitmap.CompressFormat.JPEG, 92, it) }
                  bmp.recycle()
                  files.add(f)
              }
              return files
          }
