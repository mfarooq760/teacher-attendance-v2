          // =====================================================================
          // PROMOTE ATTENDANCE SESSION  (table 2 -> table 2)
          // =====================================================================
          @Composable
          fun PromoteScreen(db: DatabaseHelper, onBack: () -> Unit) {
              val context = LocalContext.current
              var fromSession by remember { mutableStateOf("") }
              var fromMonthIdx by remember { mutableIntStateOf(0) }
              var toSession by remember { mutableStateOf("") }
              var toMonthIdx by remember { mutableIntStateOf(0) }
              var tick by remember { mutableIntStateOf(0) }
              val selected = remember { mutableStateListOf<Long>() }
              val validFrom = isValidSession(fromSession)
              val validTo = isValidSession(toSession)

              // 1) rows of tblAttendanceEnrollment for the current session + month
              // 2) their foreign keys are used to fetch name / father-husband from tblTeachers (joined in one query)
              val source = remember(fromSession, fromMonthIdx, tick) {
                  if (validFrom) db.getEnrolledTeachers(fromSession, fromMonthIdx + 1) else emptyList()
              }
              val alreadyInTarget = remember(toSession, toMonthIdx, tick) {
                  if (validTo) db.getEnrolledIds(toSession, toMonthIdx + 1) else emptySet()
              }

              LaunchedEffect(fromSession, fromMonthIdx, toSession, toMonthIdx, tick) {
                  selected.clear()
                  if (validTo) {
                      selected.addAll(source.filter { it.recordId !in alreadyInTarget }.map { it.recordId })
                  }
              }

              ScreenFrame("Promote Attendance Session", onBack) {
                  Text("1. Current enrolment (filter)", fontWeight = FontWeight.Bold)
                  SessionField(fromSession, { fromSession = it }, "Current Session (0000/00)")
                  DropdownField("Current Month", MONTHS, fromMonthIdx) { fromMonthIdx = it }

                  Text("2. Promote to", fontWeight = FontWeight.Bold)
                  SessionField(toSession, { toSession = it }, "Next Session (0000/00)")
                  DropdownField("Next Month", MONTHS, toMonthIdx) { toMonthIdx = it }

                  if (!validFrom) {
                      Text("Type a complete current session (for example 2026/27).", color = Color.Gray)
                  } else if (source.isEmpty()) {
                      Text("No teachers are enrolled for ${MONTHS[fromMonthIdx]} $fromSession.", color = Color.Gray)
                  } else {
                      Text("3. Teachers enrolled in ${MONTHS[fromMonthIdx]} $fromSession (${source.size})", fontWeight = FontWeight.Bold)
                      if (!validTo) {
                          Text("Type a complete next session to enable promotion.", color = Color.Gray)
                      }
                      source.forEach { t ->
                          val already = validTo && t.recordId in alreadyInTarget
                          Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                              Checkbox(
                                  checked = already || t.recordId in selected,
                                  enabled = validTo && !already,
                                  onCheckedChange = { c ->
                                      if (c) selected.add(t.recordId) else selected.remove(t.recordId)
                                  }
                              )
                              Column {
                                  Text(t.name, fontWeight = FontWeight.SemiBold)
                                  Text(
                                      t.fatherName + if (already) "   ✔ already in ${MONTHS[toMonthIdx]} $toSession" else "",
                                      color = if (already) Color(0xFF2E7D32) else Color.Gray
                                  )
                              }
                          }
                      }

                      if (validTo) {
                          OutlinedButton(
                              onClick = {
                                  selected.clear()
                                  selected.addAll(source.filter { it.recordId !in alreadyInTarget }.map { it.recordId })
                              },
                              modifier = Modifier.fillMaxWidth()
                          ) { Text("Select All Not Yet Promoted") }

                          MenuButton(
                              "Save: Promote ${selected.size} to ${MONTHS[toMonthIdx]} $toSession",
                              "btnSavePromotion"
                          ) {
                              if (selected.isEmpty()) {
                                  Toast.makeText(context, "Nothing to promote", Toast.LENGTH_SHORT).show()
                              } else {
                                  val n = db.enrol(selected.toList(), toSession, listOf(toMonthIdx + 1))
                                  tick++
                                  Toast.makeText(context, "$n teacher(s) promoted", Toast.LENGTH_SHORT).show()
                              }
                          }
                      }
                  }
              }
          }

          // =====================================================================
          // TAKE ATTENDANCE  (table 3, full date)
          // =====================================================================
          @Composable
          fun TakeAttendanceScreen(db: DatabaseHelper, onBack: () -> Unit) {
              val context = LocalContext.current
              var session by remember { mutableStateOf("") }
              var dateIso by remember { mutableStateOf(todayIso()) }
              var tick by remember { mutableIntStateOf(0) }
              val statuses = remember { mutableStateMapOf<Long, String>() }
              val valid = isValidSession(session)
              val month = monthOfIso(dateIso)

              val enrolled = remember(session, dateIso, tick) {
                  if (valid) db.getEnrolledTeachers(session, month) else emptyList()
              }

              LaunchedEffect(session, dateIso, tick) {
                  statuses.clear()
                  if (valid) {
                      val existing = db.getAttendanceForDate(session, dateIso)
                      db.getEnrolledTeachers(session, monthOfIso(dateIso)).forEach {
                          statuses[it.enrollmentId] = existing[it.enrollmentId] ?: ST_PRESENT
                      }
                  }
              }

              val options = listOf(
                  ST_PRESENT to "P", ST_ABSENT to "A", ST_LATE to "L", ST_HALF to "HD", ST_LEAVE to "LV"
              )
              val statusColors = mapOf(
                  ST_PRESENT to Color(0xFF2E7D32),
                  ST_ABSENT to Color(0xFFC62828),
                  ST_LATE to Color(0xFF1565C0),
                  ST_HALF to Color(0xFF6A1B9A),
                  ST_LEAVE to Color(0xFFEF6C00)
              )

              ScreenFrame("Take Attendance", onBack) {
                  SessionField(session, { session = it }, "Attendance Session (0000/00)")
                  DateField("Attendance Date", dateIso) { dateIso = it }

                  if (!valid) {
                      Text("Type a complete session (for example 2026/27).", color = Color.Gray)
                  } else if (enrolled.isEmpty()) {
                      Text(
                          "No teachers are enrolled for ${MONTHS[month - 1]} $session. Use Enrol Teacher first.",
                          color = Color.Gray
                      )
                  } else {
                      Text(
                          "P = Present (nothing stored), A = Absent, L = Late, HD = Half Day, LV = Leave",
                          color = Color.Gray
                      )
                      enrolled.forEach { t ->
                          val current = statuses[t.enrollmentId] ?: ST_PRESENT
                          Card(modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text(t.name, fontWeight = FontWeight.SemiBold)
                                  Text(t.fatherName, color = Color.Gray)
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                      options.forEach { (code, label) ->
                                          FilterChip(
                                              selected = current == code,
                                              onClick = { statuses[t.enrollmentId] = code },
                                              label = { Text(label) },
                                              colors = FilterChipDefaults.filterChipColors(
                                                  selectedContainerColor = statusColors.getValue(code),
                                                  selectedLabelColor = Color.White
                                              )
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      Text(
                          "Absent ${statuses.values.count { it == ST_ABSENT }}, " +
                              "Late ${statuses.values.count { it == ST_LATE }}, " +
                              "Half Day ${statuses.values.count { it == ST_HALF }}, " +
                              "Leave ${statuses.values.count { it == ST_LEAVE }}",
                          fontWeight = FontWeight.Bold
                      )

                      MenuButton("Save Attendance for ${displayDate(dateIso)}", "btnSaveAttendance") {
                          db.saveAttendanceDate(dateIso, enrolled, statuses.toMap())
                          tick++
                          Toast.makeText(context, "Attendance saved", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }

          // =====================================================================
          // PRINT ATTENDANCE  (session + two dates from table 3)
          // =====================================================================
          @Composable
          fun PrintAttendanceScreen(db: DatabaseHelper, onBack: () -> Unit) {
              val context = LocalContext.current
              var session by remember { mutableStateOf("") }
              var fromDate by remember { mutableStateOf(firstOfMonthIso()) }
              var toDate by remember { mutableStateOf(todayIso()) }
              val valid = isValidSession(session)
              val rangeOk = fromDate <= toDate
              val rows = remember(session, fromDate, toDate) {
                  if (valid && rangeOk) db.getAttendanceBetween(session, fromDate, toDate) else emptyList()
              }

              ScreenFrame("Print Attendance", onBack) {
                  SessionField(session, { session = it }, "Attendance Session (0000/00)")
                  DateField("From date", fromDate) { fromDate = it }
                  DateField("To date", toDate) { toDate = it }

                  if (!valid) {
                      Text("Type a complete session (for example 2026/27).", color = Color.Gray)
                  } else if (!rangeOk) {
                      Text("'From date' must not be after 'To date'.", color = RED)
                  } else {
                      Text("${rows.size} record(s) found", fontWeight = FontWeight.Bold)
                      Text(
                          "Absent ${rows.count { it.status == ST_ABSENT }}, " +
                              "Late ${rows.count { it.status == ST_LATE }}, " +
                              "Half Day ${rows.count { it.status == ST_HALF }}, " +
                              "Leave ${rows.count { it.status == ST_LEAVE }}"
                      )
                  }

                  MenuButton("Print", "btnPrintAttendanceNow") {
                      if (!valid || !rangeOk || rows.isEmpty()) {
                          Toast.makeText(context, "Nothing to print for this filter", Toast.LENGTH_SHORT).show()
                      } else {
                          try {
                              printAttendance(context, AttendanceReportLayout(session, fromDate, toDate, rows))
                          } catch (e: Exception) {
                              Toast.makeText(context, "Print failed: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
                  OutlinedButton(
                      onClick = {
                          if (!valid || !rangeOk || rows.isEmpty()) {
                              Toast.makeText(context, "Nothing to share for this filter", Toast.LENGTH_SHORT).show()
                          } else {
                              try {
                                  val files = renderAttendanceImages(
                                      context, AttendanceReportLayout(session, fromDate, toDate, rows)
                                  )
                                  shareImages(context, files)
                              } catch (e: Exception) {
                                  Toast.makeText(context, "Image failed: ${e.message}", Toast.LENGTH_LONG).show()
                              }
                          }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) { Text("Share as Image") }
              }
          }

