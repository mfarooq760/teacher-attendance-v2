          data class ColumnSpec(val name: String, val definition: String)

          data class TableSpec(
              val name: String,
              val columns: List<ColumnSpec>,
              val constraints: List<String> = emptyList()
          ) {
              fun createSql(): String {
                  val lines = columns.map { "  " + it.name + " " + it.definition } +
                      constraints.map { "  " + it }
                  return "CREATE TABLE IF NOT EXISTS " + name + " (\n" + lines.joinToString(",\n") + "\n);"
              }
          }

          // The ONLY place that describes this app's backend. Change it here and the script follows.
