                          ColumnSpec("FatherHusbandName", "TEXT NOT NULL"),
                          ColumnSpec("AppointmentSession", "TEXT NOT NULL")
                      )
                  ),
                  TableSpec(
                      "tblAttendanceEnrollment",
                      listOf(
                          ColumnSpec("EnrollmentID", "BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY"),
                          ColumnSpec("EnrollmentRecordIDFK", "BIGINT NOT NULL REFERENCES tblTeachers(RecordID) ON DELETE CASCADE"),
                          ColumnSpec("AttendanceEnrollmentSession", "TEXT NOT NULL"),
                          ColumnSpec("AttendanceEnrollmentMonth", "INTEGER NOT NULL")
                      ),
                      listOf("UNIQUE (EnrollmentRecordIDFK, AttendanceEnrollmentSession, AttendanceEnrollmentMonth)")
                  ),
                  TableSpec(
                      "tblAttendanceRecords",
                      listOf(
                          ColumnSpec("AttendanceID", "BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY"),
                          ColumnSpec("AttendanceRecordIDFK", "BIGINT NOT NULL REFERENCES tblTeachers(RecordID) ON DELETE CASCADE"),
                          ColumnSpec("AttendanceEnrollmentIDFK", "BIGINT NOT NULL REFERENCES tblAttendanceEnrollment(EnrollmentID) ON DELETE CASCADE"),
                          ColumnSpec("AttendanceDate", "TEXT NOT NULL"),
                          ColumnSpec("AttendanceStatus", "TEXT NOT NULL")
                      ),
                      listOf("UNIQUE (AttendanceEnrollmentIDFK, AttendanceDate)")
                  )
              )

              val tableNames: List<String> get() = tables.map { it.name }

              // Readable description: names, tables, fields and relationships (REFERENCES = foreign key).
              fun summary(): String = buildString {
                  appendLine("Backend: " + BACKEND_NAME)
                  appendLine("Database: " + DATABASE)
                  appendLine("User: " + USER + " (password is inside the script)")
                  tables.forEach { t ->
