          @Composable
          fun TakeAttendanceScreen(db: DatabaseHelper, onBack: () -> Unit) {
              val context = LocalContext.current
              var session by remember { mutableStateOf("") }
              var monthIdx by remember { mutableIntStateOf(0) }
              var yearIdx by remember { mutableIntStateOf(0) }
              var dayIdx by remember { mutableIntStateOf(0) }
              var tick by remember { mutableIntStateOf(0) }
              val statuses = remember { mutableStateMapOf<Long, String>() }
              val valid = isValidSession(session)

              val startYear = if (valid) session.substring(0, 4).toInt() else 0
              val yearOptions = remember(session) {
                  if (valid) listOf(startYear.toString(), (startYear + 1).toString()) else listOf("")
              }
              LaunchedEffect(monthIdx, session) { yearIdx = if (monthIdx >= 3) 0 else 1 }

              val year = if (valid) startYear + minOf(yearIdx, 1) else 0
              val maxDay = daysInMonth(year, monthIdx + 1)
              val dayIndex = minOf(dayIdx, maxDay - 1)
              val dayOptions = remember(maxDay) { (1..maxDay).map { it.toString() } }
              val dateIso = if (valid) toIso(year, monthIdx + 1, dayIndex + 1) else ""

              val enrolled = remember(session, monthIdx, tick) {
                  if (valid) db.getEnrolledTeachers(session, monthIdx + 1) else emptyList()
              }

              LaunchedEffect(session, monthIdx, dateIso, tick) {
                  statuses.clear()
                  if (valid) {
                      val existing = db.getAttendanceForDate(session, monthIdx + 1, dateIso)
                      db.getEnrolledTeachers(session, monthIdx + 1).forEach {
                          statuses[it.enrollmentId] = existing[it.enrollmentId] ?: ST_PRESENT
                      }
