          cat << 'EOF' > app/src/main/java/com/school/teacherrecords/PrintReport.kt
          package com.school.teacherrecords

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.pdf.PdfDocument
          import android.os.Bundle
          import android.os.CancellationSignal
          import android.os.ParcelFileDescriptor
          import android.print.PageRange
          import android.print.PrintAttributes
          import android.print.PrintDocumentAdapter
          import android.print.PrintDocumentInfo
          import android.print.PrintManager
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          const val SCHOOL_NAME = "Islamic International Model School"

          class AttendancePrintReport {
              private val pageW = 595
              private val pageH = 842
              private val margin = 36f
              private val doc = PdfDocument()
              private var page: PdfDocument.Page? = null
              private var canvas: Canvas? = null
              private var pageNum = 0
              private var y = 0f
              private var detailHeader = false
              private var session = ""
              private var fromIso = ""
              private var toIso = ""

              private val schoolPaint = Paint().apply {
                  color = Color.BLACK; textSize = 18f; typeface = Typeface.DEFAULT_BOLD
                  textAlign = Paint.Align.CENTER; isAntiAlias = true
              }
              private val titlePaint = Paint().apply {
                  color = Color.DKGRAY; textSize = 12f; textAlign = Paint.Align.CENTER; isAntiAlias = true
              }
              private val infoPaint = Paint().apply {
                  color = Color.BLACK; textSize = 10f; textAlign = Paint.Align.CENTER; isAntiAlias = true
              }
              private val boldPaint = Paint().apply {
                  color = Color.BLACK; textSize = 10f; typeface = Typeface.DEFAULT_BOLD; isAntiAlias = true
              }
              private val textPaint = Paint().apply {
                  color = Color.BLACK; textSize = 10f; isAntiAlias = true
              }
              private val footPaint = Paint().apply {
                  color = Color.GRAY; textSize = 9f; textAlign = Paint.Align.CENTER; isAntiAlias = true
              }
              private val linePaint = Paint().apply { color = Color.BLACK; strokeWidth = 1f }
              private val bgPaint = Paint().apply { color = Color.rgb(224, 224, 224) }

              private val colNo = margin
              private val colDate = margin + 28f
              private val colName = margin + 100f
              private val colFather = margin + 265f
              private val colStatus = margin + 420f

              private val sumName = margin
              private val sumFather = margin + 170f
              private val sumA = margin + 340f
              private val sumL = margin + 390f
              private val sumH = margin + 430f
              private val sumV = margin + 485f

              private fun fit(text: String, paint: Paint, maxW: Float): String {
                  if (paint.measureText(text) <= maxW) return text
                  var s = text
                  while (s.isNotEmpty() && paint.measureText("$s...") > maxW) s = s.dropLast(1)
                  return "$s..."
              }

              private fun finishPage() {
                  val p = page ?: return
                  canvas!!.drawText("Page $pageNum", pageW / 2f, pageH - 20f, footPaint)
                  doc.finishPage(p)
                  page = null
              }

              private fun newPage() {
                  finishPage()
                  pageNum++
                  val info = PdfDocument.PageInfo.Builder(pageW, pageH, pageNum).create()
                  val p = doc.startPage(info)
                  page = p
                  val c = p.canvas
                  canvas = c
                  c.drawText(SCHOOL_NAME, pageW / 2f, 46f, schoolPaint)
                  c.drawText("Teacher Attendance Report", pageW / 2f, 64f, titlePaint)
                  c.drawText(
                      "Session: $session     From: ${isoToDisplay(fromIso)}     To: ${isoToDisplay(toIso)}",
                      pageW / 2f, 80f, infoPaint
                  )
                  c.drawLine(margin, 90f, pageW - margin, 90f, linePaint)
                  y = 112f
              }

              private fun drawDetailHeader() {
                  val c = canvas!!
                  c.drawRect(margin, y - 12f, pageW - margin, y + 6f, bgPaint)
                  c.drawText("#", colNo + 2f, y, boldPaint)
                  c.drawText("Date", colDate, y, boldPaint)
                  c.drawText("Teacher Name", colName, y, boldPaint)
                  c.drawText("Father / Husband", colFather, y, boldPaint)
                  c.drawText("Status", colStatus, y, boldPaint)
                  y += 20f
              }

              private fun ensure(h: Float) {
                  if (y + h > pageH - 50f) {
                      newPage()
                      if (detailHeader) drawDetailHeader()
                  }
              }

              fun build(file: File, session: String, fromIso: String, toIso: String, rows: List<PrintRow>): Int {
                  this.session = session
                  this.fromIso = fromIso
                  this.toIso = toIso
                  newPage()

                  if (rows.isEmpty()) {
                      canvas!!.drawText(
                          "No absent / late / half day / leave records found for the selected session and dates.",
                          margin, y, textPaint
                      )
                      y += 20f
                  } else {
                      detailHeader = true
                      drawDetailHeader()
                      rows.forEachIndexed { i, r ->
                          ensure(18f)
                          val c = canvas!!
                          c.drawText("${i + 1}", colNo + 2f, y, textPaint)
                          c.drawText(isoToDisplay(r.date), colDate, y, textPaint)
                          c.drawText(fit(r.name, textPaint, colFather - colName - 6f), colName, y, textPaint)
                          c.drawText(fit(r.fatherName, textPaint, colStatus - colFather - 6f), colFather, y, textPaint)
                          c.drawText(statusLabel(r.status), colStatus, y, textPaint)
                          y += 16f
                      }
                      detailHeader = false

                      ensure(60f)
                      y += 14f
                      canvas!!.drawText("Summary", margin, y, boldPaint)
                      y += 14f
                      canvas!!.drawRect(margin, y - 12f, pageW - margin, y + 6f, bgPaint)
                      canvas!!.drawText("Teacher Name", sumName + 2f, y, boldPaint)
                      canvas!!.drawText("Father / Husband", sumFather, y, boldPaint)
                      canvas!!.drawText("Absent", sumA, y, boldPaint)
                      canvas!!.drawText("Late", sumL, y, boldPaint)
                      canvas!!.drawText("Half Day", sumH, y, boldPaint)
                      canvas!!.drawText("Leave", sumV, y, boldPaint)
                      y += 20f

                      val groups = rows.groupBy { it.name to it.fatherName }
                          .toList()
                          .sortedBy { it.first.first.lowercase() }
                      for ((key, list) in groups) {
                          ensure(18f)
                          val c = canvas!!
                          c.drawText(fit(key.first, textPaint, sumFather - sumName - 6f), sumName + 2f, y, textPaint)
                          c.drawText(fit(key.second, textPaint, sumA - sumFather - 6f), sumFather, y, textPaint)
                          c.drawText("${list.count { it.status == ST_ABSENT }}", sumA, y, textPaint)
                          c.drawText("${list.count { it.status == ST_LATE }}", sumL, y, textPaint)
                          c.drawText("${list.count { it.status == ST_HALF }}", sumH, y, textPaint)
                          c.drawText("${list.count { it.status == ST_LEAVE }}", sumV, y, textPaint)
                          y += 16f
                      }
                  }

                  ensure(46f)
                  y += 12f
                  canvas!!.drawLine(margin, y, pageW - margin, y, linePaint)
                  y += 18f
                  val today = SimpleDateFormat("dd MMMM yyyy", Locale.ENGLISH).format(Date())
                  canvas!!.drawText("Printed on: $today", margin, y, boldPaint)

                  finishPage()
                  FileOutputStream(file).use { doc.writeTo(it) }
                  val total = pageNum
                  doc.close()
                  return total
              }
          }

          class AttendancePrintAdapter(
              private val context: Context,
              private val jobTitle: String,
              private val builder: (File) -> Int
          ) : PrintDocumentAdapter() {

              private val file = File(context.cacheDir, "print_attendance.pdf")

              override fun onLayout(
                  oldAttributes: PrintAttributes?,
                  newAttributes: PrintAttributes?,
                  cancellationSignal: CancellationSignal?,
                  callback: LayoutResultCallback?,
                  extras: Bundle?
              ) {
                  if (cancellationSignal?.isCanceled == true) {
                      callback?.onLayoutCancelled()
                      return
                  }
                  try {
                      val pages = builder(file)
                      val info = PrintDocumentInfo.Builder(jobTitle)
                          .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)
                          .setPageCount(pages)
                          .build()
                      callback?.onLayoutFinished(info, true)
                  } catch (e: Exception) {
                      callback?.onLayoutFailed(e.message)
                  }
              }

              override fun onWrite(
                  pages: Array<out PageRange>?,
                  destination: ParcelFileDescriptor?,
                  cancellationSignal: CancellationSignal?,
                  callback: WriteResultCallback?
              ) {
                  try {
                      FileInputStream(file).use { input ->
                          FileOutputStream(destination!!.fileDescriptor).use { output ->
                              input.copyTo(output)
                          }
                      }
                      callback?.onWriteFinished(arrayOf(PageRange.ALL_PAGES))
                  } catch (e: Exception) {
                      callback?.onWriteFailed(e.message)
                  }
              }
          }

          fun printAttendance(context: Context, session: String, fromIso: String, toIso: String, rows: List<PrintRow>) {
              val pm = context.getSystemService(Context.PRINT_SERVICE) as PrintManager
              val title = "Teacher_Attendance_" + session.replace("/", "-")
              val adapter = AttendancePrintAdapter(context, title) { file ->
                  AttendancePrintReport().build(file, session, fromIso, toIso, rows)
              }
              pm.print(
                  title,
                  adapter,
                  PrintAttributes.Builder().setMediaSize(PrintAttributes.MediaSize.ISO_A4).build()
              )
          }
